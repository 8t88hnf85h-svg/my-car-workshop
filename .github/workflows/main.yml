name: Deploy iOS App to App Store Connect

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup App Store Connect API Key File
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.private_keys
          echo "$PRIVATE_KEY" > ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}.p8
          echo "API Key file created successfully!"

      - name: Verify Key Configuration
        run: |
          echo "Key ID: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}"
          echo "Issuer ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          echo "Authentication setup is ready for building!"
