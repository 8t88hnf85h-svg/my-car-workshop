name: Build and Upload iOS to TestFlight

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Project Dependencies
        run: |
          if [ -f "package.json" ]; then
            npm install
          fi

      - name: Build Web Assets
        run: |
          npm run build || true

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Verify iOS Workspace
        run: |
          if [ -d "ios" ]; then
            echo "iOS folder verified successfully."
          else
            echo "iOS folder not found"
            exit 1
          fi
