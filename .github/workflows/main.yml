name: Deploy iOS App to App Store Connect

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate App Store Connect API
        uses: apple-actions/import-app-store-connect-api-key@v2
        with:
          key-id: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Verify Authentication Success
        run: |
          echo "Successfully authenticated with App Store Connect API!"
          echo "Ready for building and uploading the app."
