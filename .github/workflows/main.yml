name: Deploy iOS App to App Store Connect

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install and Build Web App
        run: |
          if [ -f "package.json" ]; then
            npm install
            npm run build
            echo "Web build completed successfully!"
          fi

      - name: Setup App Store Connect API Key File
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.private_keys
          echo "$PRIVATE_KEY" > ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}.p8
          echo "API Key file created successfully!"

      - name: Check Capacitor Project Configuration
        run: |
          if [ -d "ios" ]; then
            echo "iOS folder found in the project!"
          else
            echo "Warning: iOS folder not found yet. Make sure Capacitor iOS is configured."
          fi
