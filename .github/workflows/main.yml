name: iOS Release (App Store Connect)

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --no-save || bun install --force || true

      - name: Build Web Assets
        run: bun run build || true

      - name: Sync Capacitor iOS
        run: bun x cap sync ios || true

      - name: Increment Build Number
        run: |
          if [ -d "ios/App" ]; then
            cd ios/App
            # تحديث رقم البناء تلقائياً بناءً على رقم الـ Run في جيت هاب
            agvtool new-version -all ${{ github.run_number }}
            cd ../..
          fi

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane

      - name: Upload to TestFlight via Fastlane
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_FILEPATH: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          if [ -d "ios" ]; then
            cd ios
          fi
          fastlane pilot upload --skip_waiting_for_build_processing true || true
