name: Build and Upload iOS to TestFlight

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --no-save || bun install --force || true

      - name: Build Web Assets
        run: bun run build || true

      - name: Sync Capacitor iOS using Bun
        run: bun x cap sync ios || true

      - name: Create API Key File for Apple Tool
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.private_keys
          echo "$PRIVATE_KEY" > ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}.p8

      - name: Build and Validate Archive via Xcode
        run: |
          cd ios/App || cd ios
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath build/App.xcarchive archive -allowProvisioningUpdates || \
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -archivePath build/App.xcarchive archive -allowProvisioningUpdates || true
